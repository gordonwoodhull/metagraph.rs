[workspace]
resolver = "2"
members = [
    "macros",
    "tests/downstream/basic",
    "tests/downstream/own-root",
    "tests/downstream/renamed",
    "tests/fixtures",
    "tests/downstream/composed-renamed",
    "tests/downstream/reexporter",
    "tests/downstream/indirect",
    "tests/downstream/backing-provider",
    "tests/downstream/backing-user",
    "tests/downstream/backing-indirect",
]

[package]
name = "metagraph"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
metagraph-macros = { path = "macros" }

[dev-dependencies]
trybuild = "1.0.122"
m2-fixtures = { path = "tests/fixtures" }
